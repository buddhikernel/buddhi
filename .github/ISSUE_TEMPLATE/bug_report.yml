name: Bug report
description: Report a problem with the Buddhi kernel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        fields below so we can reproduce and fix the issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps (and a minimal code snippet, if possible) to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What you expected to happen, and what actually happened.
    validations:
      required: true
  - type: input
    id: buddhi-version
    attributes:
      label: buddhikernel version
      description: Output of `pip show buddhikernel` (Version field), or the git ref.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.11.5"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version.
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: false
